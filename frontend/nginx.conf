server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # The reset/stats helpers are for the load test only. Never reachable from the public web page.
    location /api/admin {
        return 404;
    }

    # Everything else under /api goes to the Spring Boot container.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
